name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start SUT
        run: |
          java -jar artifacts/app-replan-delivery.jar > sut.log 2>&1 &
          echo "Waiting for SUT to start..."
          for i in {1..30}; do
            if curl -s http://localhost:9999 > /dev/null; then
              echo "SUT is up!"
              break
            fi
            sleep 2
          done
          cat sut.log

      - name: Run tests
        run: ./gradlew test --info
        env:
          SELENIDE_HEADLESS: true